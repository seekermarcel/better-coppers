name: wiki

on:
  push:
    branches: [main]
    paths:
      - wiki/**
      - src/main/resources/data/*/recipe/**
      - automatisation/src/main/resources/data/*/recipe/**
      - .github/workflows/wiki.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # lastUpdated reads each page's history
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix develop -c sh -c 'cd wiki && npm ci && npm run build'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: wiki/.vitepress/dist
      - id: deployment
        uses: actions/deploy-pages@v4
